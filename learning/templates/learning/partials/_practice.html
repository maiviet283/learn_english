<div id="practice" class="panel panel-pad"{% if day %} data-day="{{ day.number }}"{% endif %}>
  <div class="d-flex flex-wrap align-items-center gap-3 mb-4">
    <div class="seg mode-tabs" data-value="cards">
      <button type="button" data-mode="cards" data-v="cards"><i class="bi bi-card-heading me-1"></i>Thẻ từ</button>
      <button type="button" data-mode="meaning" data-v="meaning"><i class="bi bi-translate me-1"></i>Chọn nghĩa</button>
      <button type="button" data-mode="listen" data-v="listen"><i class="bi bi-ear me-1"></i>Nghe chọn từ</button>
      <button type="button" data-mode="type" data-v="type"><i class="bi bi-keyboard me-1"></i>Nghe &amp; gõ</button>
      <button type="button" data-mode="gap" data-v="gap"><i class="bi bi-input-cursor-text me-1"></i>Điền vào câu</button>
    </div>
    <span class="ms-auto d-flex gap-2 align-items-center"><span id="practice-score" class="chip ok"></span><span id="practice-progress" class="chip tabular"></span></span>
  </div>
  <div class="bar thin mb-4"><span id="practice-bar"></span></div>
  <div id="practice-stage" class="stage"></div>
</div>
