{% load learning_tags %}<div class="vocab-grid">
{% for w in words %}
  <div class="vcard" data-word="{{ w.word }}" data-ex="{{ w.ex }}">
    <span class="chip ok sm known hidden"><i class="bi bi-patch-check-fill"></i> Đã thuộc</span>
    <div class="v-top">
      <div style="min-width:0">
        <div class="word">{{ w.word }}</div>
        <div class="d-flex align-items-center gap-2 flex-wrap mt-1"><span class="pos">{{ w.pos }}</span><span class="ipa">{{ w.ipa }}</span></div>
      </div>
      <div class="v-actions">{% say w.word %}{% say w.word 'slow' %}</div>
    </div>
    <div class="mean">{{ w.vi }}</div>
    <div class="ex">{% say w.ex 'normal' '' 'sm' %}<div><div class="en-text">{{ w.ex }}</div><div class="ex-vi">{{ w.ex_vi }}</div></div></div>
  </div>
{% endfor %}
</div>
