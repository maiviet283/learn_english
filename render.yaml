services:
  - type: web
    name: learn-english
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "./start.sh"
    domains:
      - english.vietdon.vn
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.9"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,english.vietdon.vn"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://english.vietdon.vn"
      - key: SITE_URL
        value: "https://english.vietdon.vn"
      - key: COURSE_START_DATE
        value: "2026-10-19"
